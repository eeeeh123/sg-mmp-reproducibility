task: svamp
dataset_path: ChilleD/SVAMP
dataset_name: null
output_type: generate_until
training_split: train
validation_split: test
test_split: test
doc_to_text: "{{question_concat}}\nAnswer:"
doc_to_target: "{{Answer}}"
should_decontaminate: false
metric_list:
  - metric: exact_match
    aggregation: mean
    higher_is_better: true
    ignore_case: true
    ignore_punctuation: true
    regexes_to_ignore:
      - ","
      - "\\$"
      - "\\.00$"
      - " "
generation_kwargs:
  until:
    - "Question:"
    - "\n\n"
  do_sample: false
  temperature: 0.0
  max_gen_toks: 256
repeats: 1
num_fewshot: 0
filter_list:
  - name: flexible-extract
    filter:
      - function: "regex"
        regex_pattern: "(-?[0-9\\.\\,]+)"
      - function: "take_first"
